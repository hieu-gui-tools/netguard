[project]
name = "netguard"
version = "0.1.0"
description = "Giám sát kết nối mạng Windows 11, tự động phân loại, chặn mối nguy và khôi phục mọi thay đổi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "psutil>=6.0",
    "pywintrace>=0.2.0; sys_platform == 'win32'",
]

[project.scripts]
netguard = "netguard.__main__:main"

[project.gui-scripts]
netguard-gui = "netguard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netguard"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
